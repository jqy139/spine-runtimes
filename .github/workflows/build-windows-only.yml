name: Build GDExtension (Windows Only)
on:
  workflow_dispatch:
  
env:
  GODOT_CPP_API_VERSION: "4.7"
  
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup python and scons
        uses: ./.github/actions/setup-godot-deps-4

      - name: Setup godot-cpp
        shell: bash
        run: |
          cd spine-godot/build
          ./setup-extension.sh 4.7.2-stable false

      - name: Build GDExtension (Windows editor)
        shell: bash
        run: |
          cd spine-godot/build
          ./build-extension.sh windows

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: spine-godot-windows-dll
          path: spine-godot/example-v4-extension/bin/windows/*.dll
          retention-days: 30
